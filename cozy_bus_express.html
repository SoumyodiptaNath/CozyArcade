<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cozy Bus Express</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDFBF7;
    --card: #EFE4D6;
    --canvas-bg: #E3D4C1;
    --primary: #95A792;
    --danger: #D97D64;
    --text: #4A3E3D;
    --shadow: rgba(74, 62, 61, 0.12);
    --btn-shadow: rgba(149, 167, 146, 0.4);
    --road-border: #C8B59E;
    --key-bg: #E4D5C3;
    --key-active: #95A792;
  }

  [data-theme="dark"] {
    --bg: #1E1B18;
    --card: #2C2623;
    --canvas-bg: #171412;
    --primary: #7E9A7B;
    --danger: #C86D56;
    --text: #EAE0D5;
    --shadow: rgba(0, 0, 0, 0.5);
    --btn-shadow: rgba(126, 154, 123, 0.3);
    --road-border: #3A322D;
    --key-bg: #38312D;
    --key-active: #7E9A7B;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 12px;
    touch-action: none;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    margin-bottom: 6px;
  }

  h1 { 
    margin: 0; 
    font-size: 1.4rem; 
    font-weight: 900; 
  }
  
  .theme-toggle {
    background: var(--card);
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 6px 12px;
    border-radius: 50px;
    box-shadow: 0 4px 10px var(--shadow);
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 8px;
    padding: 0 6px;
  }

  /* --- Game Canvas Area --- */
  .game-container {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1 / 1;
    background: var(--card);
    border-radius: 26px;
    padding: 8px;
    box-shadow: 0 10px 25px var(--shadow);
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    background: var(--canvas-bg);
    border-radius: 18px;
    border: 3px solid var(--road-border);
    display: block;
  }

  /* --- Bottom Control Dashboard --- */
  .dashboard-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    background: var(--card);
    padding: 12px 14px;
    border-radius: 24px;
    margin-top: 10px;
    box-shadow: 0 6px 16px var(--shadow);
    gap: 10px;
  }

  /* Virtual Steering Keys */
  .steer-key {
    flex: 1;
    height: 58px;
    background: var(--key-bg);
    border: 2px solid var(--road-border);
    color: var(--text);
    border-radius: 18px;
    font-size: 1rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 8px var(--shadow);
    transition: transform 0.06s ease, background-color 0.1s, color 0.1s;
    letter-spacing: 0.5px;
  }

  .steer-key:active, .steer-key.active-pressed {
    transform: scale(0.93);
    background: var(--key-active);
    color: white;
  }

  /* Start & Restart Action Button */
  .start-btn {
    flex: 1.2;
    height: 58px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 18px;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--btn-shadow);
    transition: transform 0.08s ease, background-color 0.2s, opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .start-btn:active { transform: scale(0.95); }

  /* --- Overlay --- */
  .overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .banner-icon {
    font-size: 2.8rem;
    animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
  }

  .banner-text {
    color: #FFF;
    font-size: 1.5rem;
    font-weight: 900;
    margin-top: 4px;
  }

  .banner-sub {
    color: #F0E6D2;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    padding: 0 14px;
  }

  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-7px) scale(1.08); }
  }

  .shake-board {
    animation: screenWobble 0.35s ease-in-out;
  }

  @keyframes screenWobble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-1deg); }
    40% { transform: translateX(6px) rotate(1deg); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Cozy Bus Express</h1>
    <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">☀️</button>
  </div>
  
  <div class="stats-bar">
    <div>Passengers: <span id="score">0</span></div>
    <div>Best Route: <span id="highScore">0</span></div>
  </div>

  <div class="game-container" id="gameBox">
    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="overlay active" id="bannerOverlay">
      <div class="banner-icon" id="bannerIcon">🚌</div>
      <div class="banner-text" id="bannerText">BOARDING CALL!</div>
      <div class="banner-sub" id="bannerSub">Use the LEFT & RIGHT keys or Arrow/A-D keys to steer!</div>
    </div>
  </div>

  <div class="dashboard-controls">
    <button class="steer-key" id="leftKey" aria-label="Steer Left">◀ LEFT</button>
    <button class="start-btn" id="startBtn" onclick="startGame()">Start Route</button>
    <button class="steer-key" id="rightKey" aria-label="Steer Right">RIGHT ▶</button>
  </div>

<script>
  /* --- Cozy Lo-Fi Music & Audio Synthesizer --- */
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let bgMusicInterval = null;

  const CHORDS = [
    [261.63, 329.63, 392.00, 493.88], // Cmaj7
    [220.00, 261.63, 329.63, 392.00], // Am7
    [174.61, 220.00, 261.63, 329.63], // Fmaj7
    [196.00, 246.94, 293.66, 349.23]  // G7
  ];
  let chordIdx = 0;

  function playLoFiChord() {
    if (!isPlaying) return;
    const chord = CHORDS[chordIdx];
    chordIdx = (chordIdx + 1) % CHORDS.length;

    chord.forEach(freq => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.015, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 2.8);
    });
  }

  function startLoFiMusic() {
    if (bgMusicInterval) clearInterval(bgMusicInterval);
    playLoFiChord();
    bgMusicInterval = setInterval(playLoFiChord, 3000);
  }

  function stopLoFiMusic() {
    if (bgMusicInterval) clearInterval(bgMusicInterval);
  }

  function playPassengerDing(scoreVal) {
    if (ctx.state === 'suspended') ctx.resume();
    [523.25, 659.25, 783.99].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq + Math.min(scoreVal * 6, 180), ctx.currentTime + (idx * 0.08));
      gain.gain.setValueAtTime(0.18, ctx.currentTime + (idx * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx * 0.08) + 0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + (idx * 0.08));
      osc.stop(ctx.currentTime + (idx * 0.08) + 0.22);
    });
  }

  function playCrashNoise() {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(25, ctx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
  }

  /* --- Game Canvas & Physics --- */
  const canvas = document.getElementById('gameCanvas');
  const c = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score');
  const highScoreDisplay = document.getElementById('highScore');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('bannerOverlay');
  const bannerIcon = document.getElementById('bannerIcon');
  const bannerText = document.getElementById('bannerText');
  const bannerSub = document.getElementById('bannerSub');
  const gameBox = document.getElementById('gameBox');
  const leftKey = document.getElementById('leftKey');
  const rightKey = document.getElementById('rightKey');

  let highScore = parseInt(localStorage.getItem('cozy-bus-highscore')) || 0;
  highScoreDisplay.textContent = highScore;

  const PASSENGERS = ['🧍', '🚶', '🎒', '🧳', '👵', '🧑‍🎓', '🐶'];

  let isPlaying = false;
  let score = 0;
  let animationId = null;

  let bus = {
    x: 250,
    y: 250,
    angle: 0,
    speed: 1.55,
    turnRate: 0.046,
    radius: 11
  };

  let history = [];
  const WAGON_SPACING = 15;
  let currentPassenger = { x: 120, y: 120, emoji: '🧍', pulse: 0 };
  let floatingTexts = [];

  /* --- Virtual & Keyboard Controls Mapping --- */
  const keys = { left: false, right: false };

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keys.left = true;
      leftKey.classList.add('active-pressed');
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keys.right = true;
      rightKey.classList.add('active-pressed');
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keys.left = false;
      leftKey.classList.remove('active-pressed');
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keys.right = false;
      rightKey.classList.remove('active-pressed');
    }
  });

  // Touch & Mouse bindings for on-screen buttons
  function bindVirtualKey(el, keyName) {
    const press = (e) => {
      e.preventDefault();
      keys[keyName] = true;
      el.classList.add('active-pressed');
    };
    const release = (e) => {
      e.preventDefault();
      keys[keyName] = false;
      el.classList.remove('active-pressed');
    };

    el.addEventListener('pointerdown', press);
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
  }

  bindVirtualKey(leftKey, 'left');
  bindVirtualKey(rightKey, 'right');

  function spawnPassenger() {
    const pad = 45;
    currentPassenger = {
      x: pad + Math.random() * (canvas.width - pad * 2),
      y: pad + Math.random() * (canvas.height - pad * 2),
      emoji: PASSENGERS[Math.floor(Math.random() * PASSENGERS.length)],
      pulse: 0
    };
  }

  function addFloatingText(text, x, y) {
    floatingTexts.push({ text, x, y, alpha: 1, life: 30 });
  }

  function startGame() {
    if (ctx.state === 'suspended') ctx.resume();
    score = 0;
    scoreDisplay.textContent = 0;
    bus.x = 250;
    bus.y = 250;
    bus.angle = Math.random() * Math.PI * 2;
    bus.speed = 1.55;
    history = [];
    floatingTexts = [];
    
    for (let i = 0; i < 400; i++) {
      history.push({ x: bus.x, y: bus.y, angle: bus.angle });
    }

    spawnPassenger();
    overlay.classList.remove('active');
    startBtn.disabled = true;
    startBtn.style.opacity = '0.5';
    isPlaying = true;
    startLoFiMusic();
    cancelAnimationFrame(animationId);
    gameLoop();
  }

  function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    stopLoFiMusic();
    playCrashNoise();

    gameBox.classList.add('shake-board');
    setTimeout(() => gameBox.classList.remove('shake-board'), 350);

    const isNewHigh = score > highScore;
    if (isNewHigh) {
      highScore = score;
      localStorage.setItem('cozy-bus-highscore', highScore);
      highScoreDisplay.textContent = highScore;
    }

    setTimeout(() => {
      bannerIcon.textContent = isNewHigh ? '🏆' : '🍂';
      bannerText.textContent = isNewHigh ? 'RECORD ROUTE!' : 'ROUTE FINISHED!';
      bannerSub.textContent = `You safely gave rides to ${score} cozy passengers!`;
      overlay.classList.add('active');
      startBtn.disabled = false;
      startBtn.style.opacity = '1';
      startBtn.textContent = 'Drive Again';
    }, 200);
  }

  function update() {
    // Steer based on active keys
    if (keys.left) bus.angle -= bus.turnRate;
    if (keys.right) bus.angle += bus.turnRate;

    // Move forward
    bus.x += Math.cos(bus.angle) * bus.speed;
    bus.y += Math.sin(bus.angle) * bus.speed;

    history.unshift({ x: bus.x, y: bus.y, angle: bus.angle });
    const maxHistoryNeeded = (score + 5) * WAGON_SPACING + 50;
    if (history.length > maxHistoryNeeded) history.pop();

    // 1. Boundary Crash Check
    const r = bus.radius;
    if (bus.x - r < 4 || bus.x + r > canvas.width - 4 || bus.y - r < 4 || bus.y + r > canvas.height - 4) {
      gameOver();
      return;
    }

    // 2. Self Collision Check
    for (let i = 4; i <= score; i++) {
      const idx = i * WAGON_SPACING;
      if (idx < history.length) {
        const seg = history[idx];
        if (Math.hypot(bus.x - seg.x, bus.y - seg.y) < bus.radius * 1.5) {
          gameOver();
          return;
        }
      }
    }

    // 3. Passenger Pickup Check
    if (Math.hypot(bus.x - currentPassenger.x, bus.y - currentPassenger.y) < bus.radius + 16) {
      score++;
      scoreDisplay.textContent = score;
      playPassengerDing(score);
      addFloatingText('+1 💖', currentPassenger.x, currentPassenger.y);

      // Smooth acceleration with saturation cap
      bus.speed = Math.min(3.0, 1.55 + (score * 0.035));
      bus.turnRate = Math.min(0.055, 0.046 + (score * 0.0003));

      spawnPassenger();
    }

    currentPassenger.pulse += 0.05;

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 0.8;
      ft.life--;
      ft.alpha = ft.life / 30;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  function draw() {
    c.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Waiting Stop & Passenger
    c.save();
    c.translate(currentPassenger.x, currentPassenger.y);
    c.beginPath();
    c.arc(0, 0, 18 + Math.sin(currentPassenger.pulse) * 3, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(217, 125, 100, 0.45)';
    c.lineWidth = 2.5;
    c.stroke();

    c.font = '24px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(currentPassenger.emoji, 0, 0);
    c.restore();

    // Draw Articulated Bus Carriages
    for (let i = score; i >= 1; i--) {
      const idx = i * WAGON_SPACING;
      if (idx < history.length) {
        const pt = history[idx];
        c.save();
        c.translate(pt.x, pt.y);
        c.rotate(pt.angle);

        // Wagon Body
        c.fillStyle = '#DDAA55';
        c.beginPath();
        c.roundRect(-10, -8, 20, 16, 5);
        c.fill();

        // Roof Trim
        c.fillStyle = '#C8943D';
        c.fillRect(-8, -7, 16, 2);

        // Window Glass
        c.fillStyle = '#3A322D';
        c.fillRect(-6, -5, 12, 10);
        c.fillStyle = '#FDFBF7';
        c.fillRect(-4, -4, 8, 8);

        // Joint
        c.fillStyle = '#3A322D';
        c.fillRect(-12, -4, 3, 8);

        c.restore();
      }
    }

    // Draw Lead Driver Cab
    c.save();
    c.translate(bus.x, bus.y);
    c.rotate(bus.angle);

    c.fillStyle = '#D97D64';
    c.beginPath();
    c.roundRect(-11, -9, 24, 18, [4, 9, 9, 4]);
    c.fill();

    // Windshield
    c.fillStyle = '#3A322D';
    c.beginPath();
    c.roundRect(5, -7, 5, 14, 2);
    c.fill();

    // Headlights
    c.fillStyle = '#FFF8DB';
    c.fillRect(11, -7, 2, 4);
    c.fillRect(11, 3, 2, 4);

    c.restore();

    // Draw Floating Text Popups
    floatingTexts.forEach(ft => {
      c.save();
      c.font = 'bold 15px Nunito';
      c.fillStyle = `rgba(217, 125, 100, ${ft.alpha})`;
      c.textAlign = 'center';
      c.fillText(ft.text, ft.x, ft.y);
      c.restore();
    });
  }

  function gameLoop() {
    if (!isPlaying) return;
    update();
    draw();
    animationId = requestAnimationFrame(gameLoop);
  }

  /* --- Dark Mode Switch --- */
  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('cozy-theme') || 'dark';
  setTheme(savedTheme);

  themeBtn.addEventListener('click', () => {
    const currentTheme = root.getAttribute('data-theme');
    setTheme(currentTheme === 'light' ? 'dark' : 'light');
  });

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('cozy-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }

  draw();
</script>
</body>
</html>
