<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cozy Drop: Shape Sorter</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* --- Color Variables --- */
  :root {
    --bg: #FDFBF7;
    --card: #EFE4D6;
    --track: #E4D5C3;
    --hole-border: #C8B49E;
    --primary: #95A792;
    --danger: #D97D64;
    --text: #4A3E3D;
    --shadow: rgba(74, 62, 61, 0.1);
    --btn-shadow: rgba(149, 167, 146, 0.4);
  }

  [data-theme="dark"] {
    --bg: #1E1B18;
    --card: #2C2623;
    --track: #201C1A;
    --hole-border: #3E3733;
    --primary: #7E9A7B;
    --danger: #C86D56;
    --text: #EAE0D5;
    --shadow: rgba(0, 0, 0, 0.45);
    --btn-shadow: rgba(126, 154, 123, 0.3);
  }

  /* --- Base Reset & Layout --- */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 12px;
    touch-action: manipulation;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 340px;
    margin-bottom: 6px;
  }

  h1 { 
    margin: 0; 
    font-size: 1.45rem; 
    font-weight: 900; 
  }
  
  .theme-toggle {
    background: var(--card);
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 6px 12px;
    border-radius: 50px;
    box-shadow: 0 4px 10px var(--shadow);
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 340px;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 10px;
    padding: 0 8px;
  }

  /* --- Main Game Canvas --- */
  .game-container {
    background: var(--card);
    width: 100%;
    max-width: 340px;
    height: 460px;
    border-radius: 28px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-shadow: 0 10px 25px var(--shadow);
    overflow: hidden;
  }

  /* --- Falling Chute --- */
  .fall-track {
    background: var(--track);
    flex-grow: 1;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: inset 0 6px 12px rgba(0,0,0,0.18);
  }

  /* Creeping Threshold Line */
  .danger-line {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    height: 4px;
    background: repeating-linear-gradient(90deg, var(--danger) 0px, var(--danger) 8px, transparent 8px, transparent 16px);
    opacity: 0.75;
    transition: bottom 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .danger-line::after {
    content: 'DANGER';
    position: absolute;
    right: 8px;
    bottom: 6px;
    font-size: 0.65rem;
    font-weight: 900;
    color: var(--danger);
    letter-spacing: 1px;
    opacity: 0.8;
  }

  /* Falling Shape */
  .falling-shape {
    position: absolute;
    width: 60px;
    height: 60px;
    left: calc(50% - 30px);
    top: -80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    will-change: transform, top;
    transition: transform 0.1s ease;
  }

  /* --- Bottom Target Cutouts Deck --- */
  .holes-deck {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    height: 72px;
  }

  .hole-btn {
    background: var(--track);
    border: 2px solid var(--hole-border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.9rem;
    box-shadow: inset 0 4px 6px rgba(0,0,0,0.2), 0 3px 6px var(--shadow);
    transition: transform 0.08s ease, border-color 0.15s, background-color 0.15s;
    padding: 0;
  }

  .hole-btn:active {
    transform: scale(0.90);
  }

  .hole-btn.flash-wrong {
    animation: flashDanger 0.28s ease-out;
  }

  .hole-btn.flash-correct {
    animation: flashSuccess 0.18s ease-out;
  }

  /* --- Controls --- */
  .start-btn {
    margin-top: 14px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 36px;
    border-radius: 99px;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--btn-shadow);
    transition: transform 0.1s ease;
  }
  .start-btn:active { transform: scale(0.95); }

  /* --- Overlays & Banners --- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .banner-icon {
    font-size: 3.2rem;
    animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
  }

  .banner-text {
    color: #FFF;
    font-size: 1.7rem;
    font-weight: 900;
    margin-top: 4px;
  }

  .banner-sub {
    color: #F0E6D2;
    font-size: 0.9rem;
    font-weight: 700;
    text-align: center;
    padding: 0 16px;
  }

  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-10px) scale(1.08); }
  }

  @keyframes flashDanger {
    0% { background: var(--danger); border-color: var(--danger); transform: scale(0.90); }
    100% { background: var(--track); border-color: var(--hole-border); transform: scale(1); }
  }

  @keyframes flashSuccess {
    0% { transform: scale(1.15); background: var(--primary); }
    100% { transform: scale(1); background: var(--track); }
  }

  .shake-board {
    animation: screenWobble 0.4s ease-in-out;
  }

  @keyframes screenWobble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Cozy Drop</h1>
    <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">☀️</button>
  </div>
  
  <div class="stats-bar">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="highScore">0</span></div>
  </div>

  <div class="game-container" id="gameBox">
    <div class="fall-track" id="track">
      <div class="danger-line" id="dangerLine"></div>
      <div class="falling-shape" id="currentShape"></div>
    </div>

    <div class="holes-deck" id="holesDeck"></div>

    <div class="overlay" id="bannerOverlay">
      <div class="banner-icon" id="bannerIcon">🍂</div>
      <div class="banner-text" id="bannerText">STEADY...</div>
      <div class="banner-sub" id="bannerSub">Match the falling shape before it crosses!</div>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="initGameFlow()">Start Drop</button>

<script>
  /* --- Expanded Themed Emoji Pools --- */
  const THEMED_POOLS = [
    // Garden & Orchard
    ['🍓', '🍋', '🍇', '🥑', '🫐', '🍑', '🍒', '🍉'],
    // Forest & Cottagecore
    ['🌸', '🍄', '🌰', '🍃', '🌷', '🌿', '🪵', '🌻'],
    // Warm Bakery & Treats
    ['🥐', '☕', '🍪', '🥨', '🥞', '🍩', '🧁', '🧇'],
    // Celestial & Sky
    ['⭐', '🌙', '☁️', '⚡', '🪐', '☀️', '🌈', '✨'],
    // Cozy Hobbies & Home
    ['🧶', '🎨', '📖', '🪴', '🕯️', '🪡', '🧸', '🍵'],
    // Under the Sea
    ['🐚', '🪸', '🐠', '🫧', '🐙', '🦀', '🐬', '🦪'],
    // Autumn Harvest
    ['🎃', '🍎', '🍂', '🌽', '🥧', '🍁', '🧣', '🍯'],
    // Garden Critters
    ['🦔', '🐸', '🐿️', '🦉', '🦊', '🦆', '🐝', '🐌']
  ];

  /* --- Procedural Variety Generators --- */
  function getRandomFour(array) {
    const shuffled = [...array].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 4);
  }

  function getProceduralSet(currentScore) {
    // Every 20 points: trigger a special chaotic "Wild Mix" from ALL pools
    if (currentScore > 0 && currentScore % 20 === 0) {
      const allEmojis = THEMED_POOLS.flat();
      return getRandomFour(allEmojis);
    }
    // Otherwise pick a random theme pool and extract a fresh 4-item subset
    const randomPool = THEMED_POOLS[Math.floor(Math.random() * THEMED_POOLS.length)];
    return getRandomFour(randomPool);
  }

  let activeShapeSet = getProceduralSet(0);

  /* --- Web Audio Synthesizer --- */
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let musicInterval = null;

  /* Cozy Pastel Drops Progression (Ebmaj9 -> Cm9 -> Abmaj7 -> Bbsus4) */
  const DROP_CHORDS = [
    [155.56, 233.08, 293.66, 349.23], // Eb3, Bb3, D4, F4
    [130.81, 196.00, 233.08, 293.66], // C3, G3, Bb3, D4
    [103.83, 155.56, 207.65, 261.63], // Ab2, Eb3, Ab3, C4
    [116.54, 174.61, 233.08, 311.13]  // Bb2, F3, Bb3, Eb4
  ];
  let chordIdx = 0;

  function playAmbientChord() {
    if (!isPlaying) return;
    const chord = DROP_CHORDS[chordIdx];
    chordIdx = (chordIdx + 1) % DROP_CHORDS.length;

    chord.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.016, ctx.currentTime + 0.6 + (i * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.0);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 3.0);
    });
  }

  function startAmbientMusic() {
    if (musicInterval) clearInterval(musicInterval);
    playAmbientChord();
    musicInterval = setInterval(playAmbientChord, 3000);
  }

  function stopAmbientMusic() {
    if (musicInterval) clearInterval(musicInterval);
  }

  function playMatchChime(scoreVal) {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const baseFreq = 480 + Math.min(scoreVal * 14, 450);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  }

  function playMissBuzz() {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(55, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  }

  function playHighScoreFanfare() {
    if (ctx.state === 'suspended') ctx.resume();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.09));
      gain.gain.setValueAtTime(0.18, ctx.currentTime + (i * 0.09));
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.09) + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + (i * 0.09));
      osc.stop(ctx.currentTime + (i * 0.09) + 0.25);
    });
  }

  /* --- Game State Variables --- */
  let isPlaying = false;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('cozy-drop-highscore')) || 0;
  let currentTargetShape = null;
  let fallAnimationId = null;
  let fallStartTime = 0;
  let currentFallDuration = 2200;

  const scoreDisplay = document.getElementById('score');
  const highScoreDisplay = document.getElementById('highScore');
  const startBtn = document.getElementById('startBtn');
  const track = document.getElementById('track');
  const currentShapeEl = document.getElementById('currentShape');
  const holesDeck = document.getElementById('holesDeck');
  const dangerLine = document.getElementById('dangerLine');
  const overlay = document.getElementById('bannerOverlay');
  const bannerIcon = document.getElementById('bannerIcon');
  const bannerText = document.getElementById('bannerText');
  const bannerSub = document.getElementById('bannerSub');
  const gameBox = document.getElementById('gameBox');

  highScoreDisplay.textContent = highScore;

  /* --- Danger Line Threshold Creeping --- */
  function updateDangerLinePosition(currentScore) {
    const baseOffset = 20;
    const maxOffset = 130;
    const progress = Math.min(1, currentScore / 35);
    const newBottom = baseOffset + (progress * (maxOffset - baseOffset));
    dangerLine.style.bottom = `${newBottom}px`;
    return newBottom;
  }

  /* --- Speed Ramping Formula (with Jitter & Saturation) --- */
  function getFallDuration(currentScore) {
    const baseDuration = Math.max(620, 2100 - (currentScore * 50));
    const jitter = (Math.random() * 0.2) - 0.1;
    return Math.max(550, baseDuration * (1 + jitter));
  }

  /* --- Shuffle Buttons Every Turn --- */
  function renderShuffledButtons() {
    holesDeck.innerHTML = '';
    const shuffled = [...activeShapeSet].sort(() => Math.random() - 0.5);

    shuffled.forEach(shape => {
      const btn = document.createElement('button');
      btn.className = 'hole-btn';
      btn.textContent = shape;
      btn.setAttribute('data-shape', shape);
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleShapeSelection(shape, btn);
      });
      holesDeck.appendChild(btn);
    });
  }

  /* --- Spawning Next Shape --- */
  function spawnNextShape() {
    if (!isPlaying) return;

    // Refresh the 4-item set procedurally every 6 points (or trigger Wild Mix at 20)
    if (score > 0 && score % 6 === 0) {
      activeShapeSet = getProceduralSet(score);
    }

    renderShuffledButtons();
    updateDangerLinePosition(score);

    const randomIdx = Math.floor(Math.random() * activeShapeSet.length);
    currentTargetShape = activeShapeSet[randomIdx];
    currentShapeEl.textContent = currentTargetShape;
    currentShapeEl.style.transform = 'scale(1)';

    currentFallDuration = getFallDuration(score);
    fallStartTime = performance.now();

    cancelAnimationFrame(fallAnimationId);
    animateFall(performance.now());
  }

  /* --- Smooth Fall Animation --- */
  function animateFall(currentTime) {
    if (!isPlaying) return;

    const elapsed = currentTime - fallStartTime;
    const progress = elapsed / currentFallDuration;
    const trackHeight = track.clientHeight;
    const currentLineBottom = parseFloat(dangerLine.style.bottom) || 20;
    const maxTop = trackHeight - currentLineBottom - 50;

    const currentTop = -60 + (progress * (maxTop + 60));
    currentShapeEl.style.top = `${currentTop}px`;

    if (progress >= 1) {
      gameOver('missed');
    } else {
      fallAnimationId = requestAnimationFrame(animateFall);
    }
  }

  /* --- Handle Player Input --- */
  function handleShapeSelection(selectedShape, btnEl) {
    if (!isPlaying || !currentTargetShape) return;

    if (selectedShape === currentTargetShape) {
      btnEl.classList.add('flash-correct');
      setTimeout(() => btnEl.classList.remove('flash-correct'), 180);

      score++;
      scoreDisplay.textContent = score;
      playMatchChime(score);

      currentShapeEl.style.transform = 'scale(0) rotate(45deg)';
      cancelAnimationFrame(fallAnimationId);
      setTimeout(spawnNextShape, 80);
    } else {
      btnEl.classList.add('flash-wrong');
      setTimeout(() => btnEl.classList.remove('flash-wrong'), 280);
      gameOver('wrong');
    }
  }

  /* --- Game Flow & Overlays --- */
  function initGameFlow() {
    if (isPlaying) return;
    startBtn.disabled = true;

    bannerIcon.textContent = '👀';
    bannerText.textContent = 'STEADY...';
    bannerSub.textContent = 'Match before it hits the red line!';
    overlay.classList.add('active');

    setTimeout(() => {
      bannerIcon.textContent = '🚀';
      bannerText.textContent = 'DROP!';
      bannerSub.textContent = '';
      
      setTimeout(() => {
        overlay.classList.remove('active');
        startGame();
      }, 500);
    }, 800);
  }

  function startGame() {
    score = 0;
    scoreDisplay.textContent = 0;
    isPlaying = true;
    activeShapeSet = getProceduralSet(0);
    updateDangerLinePosition(0);
    currentShapeEl.style.top = '-80px';
    startAmbientMusic();
    spawnNextShape();
  }

  function gameOver(reason) {
    if (!isPlaying) return;
    isPlaying = false;
    cancelAnimationFrame(fallAnimationId);
    stopAmbientMusic();

    gameBox.classList.add('shake-board');
    setTimeout(() => gameBox.classList.remove('shake-board'), 400);

    const isNewHigh = score > highScore;
    if (isNewHigh) {
      highScore = score;
      localStorage.setItem('cozy-drop-highscore', highScore);
      highScoreDisplay.textContent = highScore;
      playHighScoreFanfare();
    } else {
      playMissBuzz();
    }

    setTimeout(() => {
      bannerIcon.textContent = isNewHigh ? '🏆' : (reason === 'wrong' ? '💥' : '⚠️');
      bannerText.textContent = isNewHigh ? 'NEW RECORD!' : 'ROUND OVER!';
      bannerSub.textContent = isNewHigh 
        ? `Cozy Reflex Master: ${score} sorted!`
        : (reason === 'wrong' ? `Wrong shape! Score: ${score}` : `Crossed the danger line! Score: ${score}`);
      overlay.classList.add('active');
      startBtn.disabled = false;
      startBtn.textContent = 'Play Again';
    }, 280);
  }

  /* --- Dark Mode Toggle --- */
  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('cozy-theme') || 'dark';
  setTheme(savedTheme);

  themeBtn.addEventListener('click', () => {
    const currentTheme = root.getAttribute('data-theme');
    setTheme(currentTheme === 'light' ? 'dark' : 'light');
  });

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('cozy-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
</script>
</body>
</html>
