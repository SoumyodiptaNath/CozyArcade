<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cozy Lighthouse Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDFBF7;
    --card: #EFE4D6;
    --sea-bg: #2B4858;
    --primary: #95A792;
    --danger: #D97D64;
    --text: #4A3E3D;
    --shadow: rgba(74, 62, 61, 0.12);
    --btn-shadow: rgba(149, 167, 146, 0.4);
    --sea-border: #C8B59E;
  }

  [data-theme="dark"] {
    --bg: #1A1816;
    --card: #27221F;
    --sea-bg: #0F1E28;
    --primary: #7E9A7B;
    --danger: #C86D56;
    --text: #EAE0D5;
    --shadow: rgba(0, 0, 0, 0.5);
    --btn-shadow: rgba(126, 154, 123, 0.3);
    --sea-border: #3A322D;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 10px;
    touch-action: manipulation;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    margin-bottom: 6px;
  }

  h1 { 
    margin: 0; 
    font-size: 1.4rem; 
    font-weight: 900; 
  }
  
  .theme-toggle {
    background: var(--card);
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 6px 12px;
    border-radius: 50px;
    box-shadow: 0 4px 10px var(--shadow);
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 8px;
    padding: 0 6px;
  }

  /* --- Game Container --- */
  .game-container {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1 / 1;
    background: var(--card);
    border-radius: 26px;
    padding: 8px;
    box-shadow: 0 10px 25px var(--shadow);
    overflow: hidden;
    cursor: pointer;
  }

  canvas {
    width: 100%;
    height: 100%;
    background: var(--sea-bg);
    border-radius: 18px;
    border: 3px solid var(--sea-border);
    display: block;
  }

  /* --- Bottom Action --- */
  .start-btn {
    margin-top: 10px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 36px;
    border-radius: 99px;
    font-size: 1.05rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--btn-shadow);
    transition: transform 0.08s ease, background-color 0.2s;
  }
  .start-btn:active { transform: scale(0.95); }

  /* --- Overlay --- */
  .overlay {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .banner-icon {
    font-size: 2.8rem;
    animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
  }

  .banner-text {
    color: #FFF;
    font-size: 1.5rem;
    font-weight: 900;
    margin-top: 4px;
  }

  .banner-sub {
    color: #F0E6D2;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    padding: 0 14px;
  }

  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-7px) scale(1.08); }
  }

  .shake-board {
    animation: screenWobble 0.35s ease-in-out;
  }

  @keyframes screenWobble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-1deg); }
    40% { transform: translateX(6px) rotate(1deg); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Lighthouse Watch</h1>
    <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">☀️</button>
  </div>
  
  <div class="stats-bar">
    <div>Pirates Caught: <span id="score">0</span></div>
    <div>Best Vigil: <span id="highScore">0</span></div>
  </div>

  <div class="game-container" id="gameBox">
    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="overlay active" id="bannerOverlay">
      <div class="banner-icon" id="bannerIcon">🗼</div>
      <div class="banner-text" id="bannerText">NIGHT VIGIL!</div>
      <div class="banner-sub" id="bannerSub">Tap anywhere ONLY when a pirate ship is in the light beam! Don't tap empty water!</div>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="startGame()">Start Watch</button>

<script>
  /* --- Ocean Ambient Music & Sound Engine (Web Audio API) --- */
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let bgMusicInterval = null;

  // Ocean Night ambient progression (Dm9 -> Gm7 -> C9 -> Fmaj7)
  const SEA_CHORDS = [
    [146.83, 220.00, 261.63, 329.63], // Dm9
    [196.00, 233.08, 293.66, 349.23], // Gm7
    [130.81, 196.00, 261.63, 311.13], // C9
    [174.61, 220.00, 261.63, 329.63]  // Fmaj7
  ];
  let chordIdx = 0;

  function playAmbientSeaChord() {
    if (!isPlaying) return;
    const chord = SEA_CHORDS[chordIdx];
    chordIdx = (chordIdx + 1) % SEA_CHORDS.length;

    chord.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.016, ctx.currentTime + 0.8 + (i * 0.1));
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.2);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 3.2);
    });
  }

  function startSeaMusic() {
    if (bgMusicInterval) clearInterval(bgMusicInterval);
    playAmbientSeaChord();
    bgMusicInterval = setInterval(playAmbientSeaChord, 3200);
  }

  function stopSeaMusic() {
    if (bgMusicInterval) clearInterval(bgMusicInterval);
  }

  function playCatchBell(scoreVal) {
    if (ctx.state === 'suspended') ctx.resume();
    [659.25, 880.00].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq + Math.min(scoreVal * 8, 250), ctx.currentTime + (idx * 0.08));
      gain.gain.setValueAtTime(0.2, ctx.currentTime + (idx * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx * 0.08) + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + (idx * 0.08));
      osc.stop(ctx.currentTime + (idx * 0.08) + 0.25);
    });
  }

  function playFoghornMiss() {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(65, ctx.currentTime + 0.45);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.45);
  }

  function playHighScoreFanfare() {
    if (ctx.state === 'suspended') ctx.resume();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.08));
      gain.gain.setValueAtTime(0.18, ctx.currentTime + (i * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.08) + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + (i * 0.08));
      osc.stop(ctx.currentTime + (i * 0.08) + 0.25);
    });
  }

  /* --- Game Canvas & Variables --- */
  const canvas = document.getElementById('gameCanvas');
  const c = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score');
  const highScoreDisplay = document.getElementById('highScore');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('bannerOverlay');
  const bannerIcon = document.getElementById('bannerIcon');
  const bannerText = document.getElementById('bannerText');
  const bannerSub = document.getElementById('bannerSub');
  const gameBox = document.getElementById('gameBox');

  let highScore = parseInt(localStorage.getItem('cozy-lighthouse-highscore')) || 0;
  highScoreDisplay.textContent = highScore;

  let isPlaying = false;
  let score = 0;
  let animationId = null;

  // Lighthouse settings
  const center = { x: 250, y: 250 };
  let beamAngle = 0;
  const BEAM_CONE = 0.42; // Width of beam in radians (~24 degrees)
  let beamSpeed = 0.032;

  // Pirate ship state
  let pirate = null;
  let particles = [];
  let floatingTexts = [];

  /* --- Speed Ramping & Random Jitter --- */
  function getBeamSpeed(currentScore) {
    const base = Math.min(0.075, 0.032 + (currentScore * 0.0018));
    const jitter = (Math.random() * 0.16) - 0.08;
    return base * (1 + jitter);
  }

  /* --- Spawning Pirate Ships in Sea --- */
  function spawnPirate() {
    const distance = 100 + Math.random() * 115;
    const angle = Math.random() * Math.PI * 2;
    pirate = {
      x: center.x + Math.cos(angle) * distance,
      y: center.y + Math.sin(angle) * distance,
      angle: angle,
      distance: distance,
      speed: (Math.random() * 0.006 + 0.004) * (Math.random() > 0.5 ? 1 : -1),
      isIlluminated: false
    };
  }

  function addFloatingText(text, x, y) {
    floatingTexts.push({ text, x, y, alpha: 1, life: 30 });
  }

  function addSparkles(x, y) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        alpha: 1,
        life: 20
      });
    }
  }

  /* --- Check if Ship is inside Beam Cone --- */
  function isShipInLight(p) {
    if (!p) return false;
    const shipAngle = Math.atan2(p.y - center.y, p.x - center.x);
    
    let diff = (shipAngle - beamAngle) % (Math.PI * 2);
    if (diff < -Math.PI) diff += Math.PI * 2;
    if (diff > Math.PI) diff -= Math.PI * 2;

    return Math.abs(diff) <= BEAM_CONE / 2;
  }

  function startGame() {
    if (ctx.state === 'suspended') ctx.resume();
    score = 0;
    scoreDisplay.textContent = 0;
    beamAngle = 0;
    beamSpeed = 0.032;
    particles = [];
    floatingTexts = [];
    
    spawnPirate();
    overlay.classList.remove('active');
    startBtn.disabled = true;
    startBtn.style.opacity = '0.5';
    isPlaying = true;
    startSeaMusic();
    cancelAnimationFrame(animationId);
    gameLoop();
  }

  function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    stopSeaMusic();
    playFoghornMiss();

    gameBox.classList.add('shake-board');
    setTimeout(() => gameBox.classList.remove('shake-board'), 350);

    const isNewHigh = score > highScore;
    if (isNewHigh) {
      highScore = score;
      localStorage.setItem('cozy-lighthouse-highscore', highScore);
      highScoreDisplay.textContent = highScore;
      playHighScoreFanfare();
    }

    setTimeout(() => {
      bannerIcon.textContent = isNewHigh ? '🏆' : '🌊';
      bannerText.textContent = isNewHigh ? 'NEW RECORD WATCH!' : 'FALSE ALARM!';
      bannerSub.textContent = `Tapped empty waters without a pirate in the light! Caught: ${score}`;
      overlay.classList.add('active');
      startBtn.disabled = false;
      startBtn.style.opacity = '1';
      startBtn.textContent = 'Keep Watch';
    }, 200);
  }

  /* --- Tap Handler (Only ends on tapping unlit waters) --- */
  gameBox.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!isPlaying || !pirate) return;

    if (pirate.isIlluminated) {
      // Caught the pirate!
      score++;
      scoreDisplay.textContent = score;
      playCatchBell(score);
      addSparkles(pirate.x, pirate.y);
      addFloatingText('⚓ Caught! +1', pirate.x, pirate.y - 12);

      beamSpeed = getBeamSpeed(score);
      spawnPirate();
    } else {
      // Tapped when NO ship was inside beam -> Instant Loss
      gameOver();
    }
  });

  function update() {
    // Rotate lighthouse beam
    beamAngle = (beamAngle + beamSpeed) % (Math.PI * 2);

    if (pirate) {
      // Drift ship along its orbit
      pirate.angle += pirate.speed;
      pirate.x = center.x + Math.cos(pirate.angle) * pirate.distance;
      pirate.y = center.y + Math.sin(pirate.angle) * pirate.distance;

      // Update whether the ship is actively inside the light beam
      pirate.isIlluminated = isShipInLight(pirate);
    }

    // Update particles & floating texts
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.life--;
      p.alpha = p.life / 20;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 0.8;
      ft.life--;
      ft.alpha = ft.life / 30;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  function draw() {
    c.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Ocean Ripples
    c.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    c.lineWidth = 1.5;
    for (let r = 80; r < 240; r += 45) {
      c.beginPath();
      c.arc(center.x, center.y, r, 0, Math.PI * 2);
      c.stroke();
    }

    // 2. Draw Pirate Ship
    if (pirate) {
      c.save();
      c.translate(pirate.x, pirate.y);
      c.rotate(pirate.angle + Math.PI / 2);

      if (pirate.isIlluminated) {
        // Spotlight glow under ship
        c.beginPath();
        c.arc(0, 0, 22, 0, Math.PI * 2);
        c.fillStyle = 'rgba(255, 235, 150, 0.35)';
        c.fill();

        // Fully illuminated pirate ship
        c.font = '26px sans-serif';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText('🏴‍☠️', 0, 0);
      } else {
        // Dim shadow silhouette in the dark sea
        c.globalAlpha = 0.18;
        c.font = '24px sans-serif';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText('⛵', 0, 0);
      }
      c.restore();
    }

    // 3. Draw Lighthouse Light Beam Cone
    c.save();
    c.translate(center.x, center.y);
    c.beginPath();
    c.moveTo(0, 0);
    c.arc(0, 0, 320, beamAngle - BEAM_CONE / 2, beamAngle + BEAM_CONE / 2);
    c.closePath();

    const beamGrad = c.createRadialGradient(0, 0, 20, 0, 0, 300);
    beamGrad.addColorStop(0, 'rgba(255, 245, 180, 0.85)');
    beamGrad.addColorStop(0.5, 'rgba(255, 235, 150, 0.4)');
    beamGrad.addColorStop(1, 'rgba(255, 235, 150, 0)');
    c.fillStyle = beamGrad;
    c.fill();
    c.restore();

    // 4. Draw Central Island & Lighthouse Tower
    c.beginPath();
    c.arc(center.x, center.y, 32, 0, Math.PI * 2);
    c.fillStyle = '#7E9A7B';
    c.fill();
    c.strokeStyle = '#5E7A5B';
    c.lineWidth = 3;
    c.stroke();

    // Lighthouse Roof / Lamp Top
    c.beginPath();
    c.arc(center.x, center.y, 16, 0, Math.PI * 2);
    c.fillStyle = '#D97D64';
    c.fill();

    // Lamp Glow Dot
    c.beginPath();
    c.arc(center.x, center.y, 7, 0, Math.PI * 2);
    c.fillStyle = '#FFF8DB';
    c.fill();

    // 5. Draw Particle Sparks
    particles.forEach(p => {
      c.save();
      c.fillStyle = `rgba(255, 235, 150, ${p.alpha})`;
      c.beginPath();
      c.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      c.fill();
      c.restore();
    });

    // 6. Draw Floating Text Popups
    floatingTexts.forEach(ft => {
      c.save();
      c.font = '900 15px Nunito';
      c.fillStyle = `rgba(255, 245, 180, ${ft.alpha})`;
      c.textAlign = 'center';
      c.fillText(ft.text, ft.x, ft.y);
      c.restore();
    });
  }

  function gameLoop() {
    if (!isPlaying) return;
    update();
    draw();
    animationId = requestAnimationFrame(gameLoop);
  }

  /* --- Dark Mode Switch --- */
  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('cozy-theme') || 'dark';
  setTheme(savedTheme);

  themeBtn.addEventListener('click', () => {
    const currentTheme = root.getAttribute('data-theme');
    setTheme(currentTheme === 'light' ? 'dark' : 'light');
  });

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('cozy-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }

  draw();
</script>
</body>
</html>
