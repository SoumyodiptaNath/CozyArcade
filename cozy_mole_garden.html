<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cozy Mole Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* --- Color Variables --- */
  :root {
    --bg: #FDFBF7;
    --card: #EFE4D6;
    --hole: #D4C3B3;
    --primary: #95A792;
    --danger: #D97D64;
    --text: #4A3E3D;
    --shadow: rgba(74, 62, 61, 0.1);
    --btn-shadow: rgba(149, 167, 146, 0.4);
  }

  [data-theme="dark"] {
    --bg: #1E1B18;
    --card: #2C2623;
    --hole: #171412;
    --primary: #7E9A7B;
    --danger: #C86D56;
    --text: #EAE0D5;
    --shadow: rgba(0, 0, 0, 0.45);
    --btn-shadow: rgba(126, 154, 123, 0.3);
  }

  /* --- Base Styles --- */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 12px;
    touch-action: manipulation;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* --- Header & Scoreboard --- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 340px;
    margin-bottom: 8px;
  }

  h1 { 
    margin: 0; 
    font-size: 1.5rem; 
    font-weight: 900; 
  }
  
  .theme-toggle {
    background: var(--card);
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 6px 12px;
    border-radius: 50px;
    box-shadow: 0 4px 10px var(--shadow);
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 340px;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 12px;
    padding: 0 8px;
  }

  /* --- 4 (Rows) x 3 (Cols) Game Board --- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    background: var(--card);
    padding: 14px;
    border-radius: 24px;
    box-shadow: 0 10px 25px var(--shadow);
    width: 100%;
    max-width: 340px;
    aspect-ratio: 3 / 4;
    position: relative;
  }

  .hole {
    background: var(--hole);
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: inset 0 5px 8px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hole.wrong-hit {
    animation: flashMiss 0.25s ease-out;
  }

  /* --- Pure CSS Cozy Mole Creature --- */
  .mole {
    position: absolute;
    top: 110%;
    width: 68px;
    height: 70px;
    background: #C4A482;
    border-radius: 34px 34px 14px 14px;
    transition: top 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12);
    display: flex;
    justify-content: center;
    pointer-events: auto;
  }

  /* Ears */
  .mole::before, .mole::after {
    content: '';
    position: absolute;
    top: -6px;
    width: 16px;
    height: 16px;
    background: #A68060;
    border-radius: 50%;
    z-index: -1;
  }
  .mole::before { left: 4px; }
  .mole::after { right: 4px; }

  /* Face layout */
  .mole-face {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Snout & Nose */
  .mole-snout {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 18px;
    background: #FDFBF7;
    border-radius: 14px;
  }
  .mole-snout::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 9px;
    height: 6px;
    background: #3B2F2F;
    border-radius: 5px;
  }

  /* Blinking Eyes */
  .mole-eye {
    position: absolute;
    top: 22px;
    width: 6px;
    height: 6px;
    background: #3B2F2F;
    border-radius: 50%;
    animation: blink 4s infinite;
  }
  .mole-eye.left { left: 16px; }
  .mole-eye.right { right: 16px; }

  /* Rosy Cheeks */
  .mole-blush {
    position: absolute;
    top: 31px;
    width: 8px;
    height: 5px;
    background: rgba(235, 120, 120, 0.45);
    border-radius: 50%;
  }
  .mole-blush.left { left: 8px; }
  .mole-blush.right { right: 8px; }

  @keyframes blink {
    0%, 96%, 100% { transform: scaleY(1); }
    98% { transform: scaleY(0.1); }
  }

  .hole.up .mole { 
    top: 14%; 
  }

  .hole.bonked .mole {
    transform: scale(0.85) rotate(15deg);
    transition: transform 0.1s;
  }

  /* --- Controls --- */
  .start-btn {
    margin-top: 16px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 36px;
    border-radius: 99px;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--btn-shadow);
    transition: transform 0.1s ease;
  }
  .start-btn:active { transform: scale(0.95); }

  /* --- Fullscreen Overlays --- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: rgba(0, 0, 0, 0.68);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .banner-icon {
    font-size: 3.5rem;
    animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
  }

  .banner-text {
    color: #FFF;
    font-size: 1.8rem;
    font-weight: 900;
    margin-top: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .banner-sub {
    color: #F0E6D2;
    font-size: 0.95rem;
    font-weight: 700;
  }

  /* --- Keyframe Animations --- */
  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-12px) scale(1.1); }
  }

  @keyframes flashMiss {
    0% { background-color: var(--danger); transform: scale(0.95); }
    100% { background-color: var(--hole); transform: scale(1); }
  }

  .shake-board {
    animation: screenWobble 0.4s ease-in-out;
  }

  @keyframes screenWobble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Cozy Mole Garden</h1>
    <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">☀️</button>
  </div>
  
  <div class="stats-bar">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="highScore">0</span></div>
  </div>

  <div class="grid" id="gameGrid">
    <div class="overlay" id="bannerOverlay">
      <div class="banner-icon" id="bannerIcon">👀</div>
      <div class="banner-text" id="bannerText">STEADY...</div>
      <div class="banner-sub" id="bannerSub">Don't tap empty holes!</div>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="initGameFlow()">Start Stroll</button>

<script>
  /* --- Dynamic Grid Construction (4 Rows x 3 Cols) --- */
  const gameGrid = document.getElementById('gameGrid');
  const moleHTML = `
    <div class="mole">
      <div class="mole-face">
        <div class="mole-eye left"></div>
        <div class="mole-eye right"></div>
        <div class="mole-blush left"></div>
        <div class="mole-blush right"></div>
        <div class="mole-snout"></div>
      </div>
    </div>
  `;

  for (let i = 0; i < 12; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML = moleHTML;
    gameGrid.prepend(hole);
  }

  /* --- Audio Synthesizer (Web Audio API) --- */
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let musicInterval = null;

  /* Cozy Garden Meadow Ambient Progression (Fmaj9 -> Dm9 -> Bbmaj7 -> Csus4) */
  const MEADOW_CHORDS = [
    [174.61, 261.63, 329.63, 392.00], // F3, C4, E4, G4
    [146.83, 220.00, 261.63, 329.63], // D3, A3, C4, E4
    [116.54, 174.61, 220.00, 293.66], // Bb2, F3, A3, D4
    [130.81, 196.00, 261.63, 349.23]  // C3, G3, C4, F4
  ];
  let chordIdx = 0;

  function playAmbientChord() {
    if (!isPlaying) return;
    const chord = MEADOW_CHORDS[chordIdx];
    chordIdx = (chordIdx + 1) % MEADOW_CHORDS.length;

    chord.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      
      // Soft swelling attack and smooth fade
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.018, ctx.currentTime + 0.8 + (i * 0.1));
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.2);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 3.2);
    });
  }

  function startAmbientMusic() {
    if (musicInterval) clearInterval(musicInterval);
    playAmbientChord();
    musicInterval = setInterval(playAmbientChord, 3200);
  }

  function stopAmbientMusic() {
    if (musicInterval) clearInterval(musicInterval);
  }

  function playPop(pitchMultiplier = 1) {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const startFreq = 340 * pitchMultiplier;
    osc.frequency.setValueAtTime(startFreq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  }

  function playMissBuzz() {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.25);
  }

  function playGameOverWobble() {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(280, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  }

  function playHighScoreChime() {
    if (ctx.state === 'suspended') ctx.resume();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.08));
      gain.gain.setValueAtTime(0.15, ctx.currentTime + (i * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.08) + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + (i * 0.08));
      osc.stop(ctx.currentTime + (i * 0.08) + 0.25);
    });
  }

  /* --- Game State Variables --- */
  let lastHole = null;
  let isPlaying = false;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('cozy-mole-highscore')) || 0;
  let moleTimer = null;

  const holes = document.querySelectorAll('.hole');
  const scoreDisplay = document.getElementById('score');
  const highScoreDisplay = document.getElementById('highScore');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('bannerOverlay');
  const bannerIcon = document.getElementById('bannerIcon');
  const bannerText = document.getElementById('bannerText');
  const bannerSub = document.getElementById('bannerSub');

  highScoreDisplay.textContent = highScore;

  /* --- Speed Ramping & Jitter --- */
  function calculateMoleDuration(currentScore) {
    const baseDuration = Math.max(320, 900 - (currentScore * 28));
    const jitter = (Math.random() * 0.3) - 0.15;
    const finalDuration = baseDuration * (1 + jitter);
    return Math.max(260, Math.min(950, finalDuration));
  }

  function randomHole() {
    const idx = Math.floor(Math.random() * holes.length);
    const hole = holes[idx];
    if (hole === lastHole) return randomHole();
    lastHole = hole;
    return hole;
  }

  function popMole() {
    if (!isPlaying) return;

    const hole = randomHole();
    const duration = calculateMoleDuration(score);
    
    hole.classList.add('up');

    moleTimer = setTimeout(() => {
      hole.classList.remove('up');
      if (isPlaying) {
        const pause = Math.max(80, 200 - (score * 5));
        setTimeout(popMole, pause);
      }
    }, duration);
  }

  /* --- Animated Start Flow --- */
  function initGameFlow() {
    if (isPlaying) return;
    startBtn.disabled = true;

    bannerIcon.textContent = '👀';
    bannerText.textContent = 'STEADY...';
    bannerSub.textContent = 'Only tap the moles!';
    overlay.classList.add('active');

    setTimeout(() => {
      bannerIcon.textContent = '🐾';
      bannerText.textContent = 'GO!';
      bannerSub.textContent = '';
      
      setTimeout(() => {
        overlay.classList.remove('active');
        startGame();
      }, 500);
    }, 800);
  }

  function startGame() {
    score = 0;
    scoreDisplay.textContent = 0;
    isPlaying = true;
    clearHoles();
    startAmbientMusic();
    popMole();
  }

  function clearHoles() {
    holes.forEach(h => h.classList.remove('up', 'bonked', 'wrong-hit'));
  }

  /* --- Game Over Flow --- */
  function gameOver(reasonHole) {
    if (!isPlaying) return;
    isPlaying = false;
    clearTimeout(moleTimer);
    stopAmbientMusic();

    if (reasonHole) reasonHole.classList.add('wrong-hit');
    gameGrid.classList.add('shake-board');
    setTimeout(() => gameGrid.classList.remove('shake-board'), 400);

    const isNewHigh = score > highScore;
    if (isNewHigh) {
      highScore = score;
      localStorage.setItem('cozy-mole-highscore', highScore);
      highScoreDisplay.textContent = highScore;
      playHighScoreChime();
    } else {
      playMissBuzz();
      setTimeout(playGameOverWobble, 150);
    }

    setTimeout(() => {
      bannerIcon.textContent = isNewHigh ? '🏆' : '🍂';
      bannerText.textContent = isNewHigh ? 'NEW BEST!' : 'BONKED OUT!';
      bannerSub.textContent = isNewHigh 
        ? `Cozy Champion: ${score} points!`
        : `Empty grass tapped! Score: ${score}`;
      overlay.classList.add('active');
      startBtn.disabled = false;
      startBtn.textContent = 'Try Again';
    }, 300);
  }

  /* --- Hole Interactions --- */
  holes.forEach(hole => {
    hole.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!isPlaying) return;

      if (hole.classList.contains('up')) {
        hole.classList.remove('up');
        hole.classList.add('bonked');
        setTimeout(() => hole.classList.remove('bonked'), 120);

        score++;
        scoreDisplay.textContent = score;

        const pitchScale = 1 + Math.min(score * 0.03, 0.8);
        playPop(pitchScale);
      } else {
        gameOver(hole);
      }
    });
  });

  /* --- Default Dark Mode & Theme Switch --- */
  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('cozy-theme') || 'dark';
  setTheme(savedTheme);

  themeBtn.addEventListener('click', () => {
    const currentTheme = root.getAttribute('data-theme');
    setTheme(currentTheme === 'light' ? 'dark' : 'light');
  });

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    localStorage.setItem('cozy-theme', theme);
    themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
</script>
</body>
</html>
